# Puts the world leaderboard (server/) online on Cloudflare Workers, free plan.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" token) and
# CLOUDFLARE_ACCOUNT_ID. Run it from the Actions tab, or push a change under server/.
name: Deploy leaderboard

on:
  workflow_dispatch:
  push:
    branches: [main, prototype-napoli]
    paths: ['server/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      # Until the secrets are added there is nothing to deploy to: skip instead of failing.
      - if: env.READY != 'true'
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the leaderboard."
      - if: env.READY == 'true'
        uses: actions/checkout@v4
      - if: env.READY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.READY == 'true'
        run: npm ci
        working-directory: server
      - if: env.READY == 'true'
        run: npx wrangler deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

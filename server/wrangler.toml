# The Pizza Driver world leaderboard: a Cloudflare Worker with one SQLite-backed Durable Object.
# Deploy with `npm run deploy` (or the "Deploy leaderboard" GitHub Action); it creates everything
# it needs on the free plan, no database to set up by hand.
name = "pizza-driver-board"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]
